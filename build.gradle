//file:noinspection GroovyAssignabilityCheck
buildscript {
	dependencies {
		classpath "de.guntram.mcmod:crowdin-translate:$crowdin_translate_version"
	}
	repositories {
		maven {
			name = 'CrowdinTranslate source'
			url = "https://minecraft.guntram.de/maven/"
		}
	}
}

plugins {
	id 'fabric-loom' version '0.12-SNAPSHOT'
	id 'maven-publish'
	// Quilt mappings
	id 'org.quiltmc.quilt-mappings-on-loom' version '4.2.0'
	// Quiltflower for decompiling Minecraft
	id 'io.github.juuxel.loom-quiltflower' version '1.7.2'
}

apply from: "https://gitlab.com/supersaiyansubtlety/mod_gradle_scripts/-/raw/$project.mod_gradle_scripts_ref/applyAll.gradle"

repositories {
	maven {
		url = "https://maven.itsmeow.dev/"
	}
}

dependencies {
	implementation("com.github.LlamaLad7:MixinExtras:${project.mixin_extras_version}") { transitive = false }
	annotationProcessor("com.github.LlamaLad7:MixinExtras:${project.mixin_extras_version}") { transitive = false }
	include("com.github.LlamaLad7:MixinExtras:${project.mixin_extras_version}") { transitive = false }

	// Fabric API
	dependedMod "net.fabricmc.fabric-api:fabric-api:", "fabric", null, null

	//Config library
	suggestedMod true, "me.shedaniel.cloth:cloth-config-fabric:", "cloth_config"
	// Config menu support
	suggestedMod true, "com.terraformersmc:modmenu:", "modmenu"
	// translation fetching
	bundledMod "de.guntram.mcmod:crowdin-translate:$project.crowdin_translate_version"

	// Mod integrations
	modCompileOnly("dev.itsmeow.betteranimalsplus:betteranimalsplus-fabric:$project.better_animals_plus_version") { transitive = false }
	modRuntimeOnly("dev.itsmeow.betteranimalsplus:betteranimalsplus-fabric:$project.better_animals_plus_version") { transitive = false }

	modCompileOnly("dev.architectury:architectury-fabric:$project.architectury_version") { transitive = false }
	modRuntimeOnly("dev.architectury:architectury-fabric:$project.architectury_version") { transitive = false }

	// speed up launching in dev
	devRuntime "com.github.astei:lazydfu:$project.lazy_dfu_version"
//	devRuntime "net.oskarstrom:DashLoader:$project.dashloader_version"

	// remember window size+pos in dev
	devRuntime "net.dblsaiko:winwonders:$project.winwonders_version"
}
